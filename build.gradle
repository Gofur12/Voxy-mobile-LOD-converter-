plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly 'com.terraformersmc:modmenu:7.2.2'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-3'
    implementation 'io.airlift:aircompressor:0.27'
    include 'org.xerial:sqlite-jdbc:3.49.1.0'
    include 'com.github.luben:zstd-jni:1.5.7-3'
    include 'io.airlift:aircompressor:0.27'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test { useJUnitPlatform() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) }; withSourcesJar() }

jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
